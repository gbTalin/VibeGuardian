<!doctype html><html><head><style>body{font:16px system-ui;background:#0f172a;color:#e2e8f0;max-width:820px;margin:48px auto;padding:0 18px}section{background:#1e293b;padding:22px;border-radius:12px;margin:16px 0}input,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:7px 0;border-radius:7px;border:1px solid #475569;background:#0f172a;color:#fff}textarea{height:80px}button{background:#2563eb;border:0;font-weight:600;cursor:pointer}pre,#view{background:#0b1220;padding:14px;border-radius:7px;white-space:pre-wrap}a{color:#93c5fd}</style></head><body><h1>VibeGuardian</h1><p>Live vulnerability intelligence for public applications.</p><section><h2>Connect Exa.ai</h2><input id="key" type="password" placeholder="Exa API key"><button onclick="save()">Save key securely</button></section><section><h2>Monitor an application</h2><input id="app" value="Demo Store API" placeholder="App name"><input id="url" placeholder="Public HTTPS URL"><textarea id="stack" placeholder="Optional tags"></textarea><button onclick="go()">Monitor URL now</button></section><section><h2>Live results</h2><button onclick="toggle()">Friendly / JSON</button><pre id="out">Ready.</pre><div id="view"></div></section><script>let d,json=true;const H={'Content-Type':'application/json','X-CG-Tenant-ID':'demo','X-CG-Actor-ID':'demo'};async function save(){out.textContent=JSON.stringify(await(await fetch('/v1/integrations/exa',{method:'POST',headers:H,body:JSON.stringify({api_key:key.value})})).json(),null,2);key.value=''}async function go(){out.textContent='Searching…';let r=await fetch('/v1/demo/monitor-now',{method:'POST',headers:H,body:JSON.stringify({app_name:app.value,public_url:url.value||null,stack:stack.value})});d=await r.json();render()}function toggle(){json=!json;render()}function render(){if(!d)return;out.textContent=json?JSON.stringify(d,null,2):'';view.innerHTML=json?'':(d.results||[]).map(x=>'<p><b>'+x.title+'</b><br><a href="'+x.url+'" target="_blank">Open source</a></p>').join('')}</script></body></html>
