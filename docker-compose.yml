services:
  api:
    build: .
    command: uvicorn cg_threat_intel.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      CG_DATABASE_URL: postgresql+psycopg://cyberguard:cyberguard@postgres:5432/cyberguard
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A cg_threat_intel.workers.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      CG_DATABASE_URL: postgresql+psycopg://cyberguard:cyberguard@postgres:5432/cyberguard
      CG_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    command: celery -A cg_threat_intel.workers.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      CG_DATABASE_URL: postgresql+psycopg://cyberguard:cyberguard@postgres:5432/cyberguard
      CG_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard -d cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

volumes:
  postgres_data:
